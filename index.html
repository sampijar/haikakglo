<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Photobox 📸</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg1:#f6ead3;
    --bg2:#f0d8b8;
    --ink:#3a2f28;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0;
    min-height:100%;
    font-family:'Poppins', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.5), transparent 40%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    overflow-x:hidden;
  }
  .scene{
    max-width:720px;
    margin:0 auto;
    padding:32px 16px 80px;
    text-align:center;
  }
  h1{
    font-size:2rem;
    margin:0 0 4px;
    letter-spacing:.5px;
  }
  .subtitle{
    margin:0 0 28px;
    opacity:.75;
    font-size:.95rem;
  }

  /* ---------- Camera ---------- */
  .camera-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .camera{
    width:280px;
    max-width:80vw;
    background:linear-gradient(145deg,#525252,#262626);
    border-radius:22px;
    padding:20px 20px 34px;
    position:relative;
    box-shadow:
      0 18px 30px rgba(0,0,0,.35),
      inset 0 2px 4px rgba(255,255,255,.15);
  }
  .camera-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
  }
  .viewfinder{
    width:42px; height:22px;
    background:#111;
    border-radius:4px;
    border:2px solid #5a5a5a;
  }
  .flash{
    width:26px; height:26px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff, #ffdf8f 55%, #caa23a);
    box-shadow:0 0 12px rgba(255,230,150,.85);
  }
  .camera-body{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }
  .lens-ring{
    width:132px; height:132px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #6b6b6b, #101010 70%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:
      inset 0 0 16px rgba(0,0,0,.75),
      0 4px 10px rgba(0,0,0,.4);
  }
  .lens{
    width:92px; height:92px;
    border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #8ec3ee, #1c3d5a 65%, #08131d);
    position:relative;
    overflow:hidden;
  }
  .lens-reflect{
    position:absolute;
    width:32px; height:14px;
    background:rgba(255,255,255,.55);
    border-radius:50%;
    top:16px; left:18px;
    transform:rotate(-30deg);
    filter:blur(1px);
  }
  .shutter-btn{
    width:78px; height:78px;
    border-radius:50%;
    border:4px solid #7a1010;
    background:radial-gradient(circle at 35% 30%, #ff6a6a, #b31212 70%);
    box-shadow:
      0 6px 0 #7a1010,
      0 12px 20px rgba(0,0,0,.5);
    cursor:pointer;
    transition:transform .08s ease, box-shadow .08s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .shutter-btn:active{
    transform:translateY(6px);
    box-shadow:0 0 0 #7a1010, 0 6px 10px rgba(0,0,0,.5);
  }
  .shutter-hint{
    color:#eee2c8;
    font-size:.72rem;
    letter-spacing:1.5px;
    text-transform:uppercase;
    opacity:.6;
  }
  .slot{
    position:absolute;
    bottom:-6px; left:50%;
    transform:translateX(-50%);
    width:120px; height:14px;
    background:#111;
    border-radius:0 0 9px 9px;
    box-shadow:inset 0 3px 5px rgba(0,0,0,.6);
  }

  /* ---------- Controls ---------- */
  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin:26px 0 10px;
    font-size:.9rem;
  }
  #counter{
    background:rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:999px;
    font-weight:600;
  }
  #resetBtn{
    border:none;
    background:var(--ink);
    color:#fff;
    padding:8px 16px;
    border-radius:999px;
    font-family:inherit;
    font-weight:600;
    font-size:.85rem;
    cursor:pointer;
    opacity:.85;
    transition:opacity .15s ease, transform .15s ease;
  }
  #resetBtn:hover{ opacity:1; transform:translateY(-1px); }

  /* ---------- Photo tray / pile ---------- */
  .tray{
    position:relative;
    min-height:420px;
    margin-top:12px;
  }
  .tray-empty{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
    opacity:.45;
    font-family:'Caveat', cursive;
    font-size:1.4rem;
    pointer-events:none;
  }
  .polaroid{
    position:absolute;
    top:0; left:50%;
    width:220px;
    background:#fffdf7;
    padding:14px 14px 46px;
    border-radius:3px;
    box-shadow:0 12px 26px rgba(0,0,0,.3);
    transform:translate(-50%, -320px) rotate(0deg);
    opacity:0;
    transition:transform .85s cubic-bezier(.17,.67,.32,1.28), opacity .35s ease;
  }
  .polaroid.drop{
    transform:translate(calc(-50% + var(--x)), var(--y)) rotate(var(--rot));
    opacity:1;
  }
  .polaroid img{
    width:100%;
    height:230px;
    object-fit:cover;
    display:block;
    background:#000;
    filter:grayscale(1) blur(9px) brightness(.45);
    transition:filter 1.7s ease-out;
  }
  .polaroid.developed img{
    filter:grayscale(0) blur(0) brightness(1);
  }
  .polaroid .cap{
    font-family:'Caveat', cursive;
    font-size:1.3rem;
    text-align:center;
    color:#3a2f28;
    margin-top:12px;
  }

  /* ---------- Flash overlay ---------- */
  .flash-overlay{
    position:fixed;
    inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
    z-index:999;
    transition:opacity .35s ease;
  }
  .flash-overlay.active{
    opacity:.9;
    transition:opacity .04s ease-in;
  }

  footer{
    text-align:center;
    opacity:.5;
    font-size:.75rem;
    margin-top:40px;
  }
</style>
</head>
<body>

<div class="scene">
  <h1>📸 Photobox</h1>
  <p class="subtitle">Pencet tombol shutter-nya buat ambil foto random dari roll kamu ✨</p>

  <div class="camera-wrap">
    <div class="camera">
      <div class="camera-top">
        <div class="viewfinder"></div>
        <div class="flash"></div>
      </div>
      <div class="camera-body">
        <div class="lens-ring">
          <div class="lens"><div class="lens-reflect"></div></div>
        </div>
        <button id="shutter" class="shutter-btn" aria-label="Ambil foto"></button>
        <div class="shutter-hint">tekan aku</div>
      </div>
      <div class="slot"></div>
    </div>
  </div>

  <div class="controls">
    <span id="counter">0 foto diambil</span>
    <button id="resetBtn">Reset</button>
  </div>

  <div class="tray" id="tray">
    <div class="tray-empty" id="trayEmpty">belum ada foto yang keluar...</div>
  </div>

  <footer>Made with a lot of memories · Atedoz Photobooth vibes</footer>
</div>

<div class="flash-overlay" id="flashOverlay"></div>

<script>
  // ----- konfigurasi foto -----
  // taruh semua foto kamu di folder /images dan daftar nama filenya di sini
  const PHOTOS = [
    'images/photo-01.jpg',
    'images/photo-02.jpg',
    'images/photo-03.jpg',
    'images/photo-04.jpg',
    'images/photo-05.jpg',
    'images/photo-06.jpg',
    'images/photo-07.jpg',
    'images/photo-08.jpg'
  ];

  const CAPTIONS = [
    'I love you 💕',
    "You're my sunshine ☀️",
    'My baby forever 🥰',
    'Cinta aku cuma kamu',
    'You + Me = 💞',
    'My favorite person',
    'Home is wherever you are',
    'Sayang kamu banyak-banyak',
    'Forever & always',
    'My person, my heart 💗',
    'Kamu takdir aku',
    'Lucky to have you'
  ];

  const tray = document.getElementById('tray');
  const trayEmpty = document.getElementById('trayEmpty');
  const counterEl = document.getElementById('counter');
  const shutter = document.getElementById('shutter');
  const resetBtn = document.getElementById('resetBtn');
  const flashOverlay = document.getElementById('flashOverlay');

  let deck = [];
  let taken = 0;
  let zCounter = 1;

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function refillDeck(){
    deck = shuffle(PHOTOS);
  }

  function updateCounter(){
    counterEl.textContent = `${taken} foto diambil`;
  }

  function playShutterSound(){
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = new Ctx();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'square';
      o.frequency.value = 900;
      g.gain.setValueAtTime(0.16, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.09);
      o.connect(g);
      g.connect(ctx.destination);
      o.start();
      o.stop(ctx.currentTime + 0.09);
    } catch(e) { /* audio not available, ignore */ }
  }

  function flashScreen(){
    flashOverlay.classList.add('active');
    setTimeout(() => flashOverlay.classList.remove('active'), 110);
  }

  function ejectPolaroid(src){
    if (trayEmpty) trayEmpty.remove();

    const card = document.createElement('figure');
    card.className = 'polaroid';

    const rotate = (Math.random() * 26 - 13).toFixed(1);
    const offsetX = (Math.random() * 170 - 85).toFixed(0);
    const offsetY = (Math.random() * 26 - 13).toFixed(0);
    card.style.setProperty('--rot', rotate + 'deg');
    card.style.setProperty('--x', offsetX + 'px');
    card.style.setProperty('--y', offsetY + 'px');
    card.style.zIndex = ++zCounter;

    const img = document.createElement('img');
    img.src = src;
    img.alt = 'photobooth photo';

    const cap = document.createElement('figcaption');
    cap.className = 'cap';
    cap.textContent = CAPTIONS[Math.floor(Math.random() * CAPTIONS.length)];

    card.appendChild(img);
    card.appendChild(cap);
    tray.appendChild(card);

    // trigger drop-in animation
    requestAnimationFrame(() => {
      requestAnimationFrame(() => card.classList.add('drop'));
    });

    // trigger "developing" effect a bit after it lands
    setTimeout(() => card.classList.add('developed'), 550);
  }

  function takePhoto(){
    if (deck.length === 0) refillDeck();
    const src = deck.pop();

    playShutterSound();
    flashScreen();
    ejectPolaroid(src);

    taken++;
    updateCounter();
  }

  function resetAll(){
    tray.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'tray-empty';
    empty.id = 'trayEmpty';
    empty.textContent = 'belum ada foto yang keluar...';
    tray.appendChild(empty);
    taken = 0;
    zCounter = 1;
    refillDeck();
    updateCounter();
  }

  shutter.addEventListener('click', takePhoto);
  resetBtn.addEventListener('click', resetAll);

  refillDeck();
  updateCounter();
</script>

</body>
</html>
